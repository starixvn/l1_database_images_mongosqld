systemLog:
  verbosity: 0
mongodb:
  net:
    auth:
      username: 'mongosqld'
      source: 'admin'
schema:
  maxVarcharLength: 8000
  stored:
    mode: custom
    source: schema
  refreshIntervalSecs: 60
runtime:
  memory:
    maxPerStage: 104857600
    maxPerServer: 524288000
    maxPerConnection: 104857600
net:
  bindIp: 0.0.0.0
  ssl:
    mode: allowSSL
    allowInvalidCertificates: true
    PEMKeyFile: /etc/mongosqld.d/mongosqld.pem
security:
  enabled: true
  defaultSource: 'admin'
